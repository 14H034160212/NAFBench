name: Update leaderboard

# On merge to main (submissions changed), re-score all submissions against the
# hidden gold and regenerate leaderboard/LEADERBOARD.md.
on:
  push:
    branches: [main]
    paths:
      - "submissions/**.jsonl"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet huggingface_hub

      - name: Score all submissions -> LEADERBOARD.md
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python leaderboard/build_leaderboard.py

      - name: Commit leaderboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/LEADERBOARD.md leaderboard/leaderboard.json
          git diff --staged --quiet || git commit -m "update leaderboard [skip ci]"
          git push

      - name: Sync leaderboard.json to HF (accessible where GitHub is blocked)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_file(
              path_or_fileobj="leaderboard/leaderboard.json", path_in_repo="leaderboard.json",
              repo_id="qbao775/naf-bench", repo_type="dataset",
              commit_message="sync leaderboard.json")
          PY
